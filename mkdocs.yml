site_name: Structural Engineering Notes
site_description: Articles and books on structural steel design, structural analysis, dynamic analysis, and earthquake engineering
site_author: Phealy Thourk
# TODO: replace YOUR-USERNAME (and the repository name if you chose another one)
site_url: https://PhealyThourk.github.io/engineering-notes/
copyright: "© 2026 Phealy Thourk. All rights reserved."

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: km
          name: ខ្មែរ
          build: true
          site_name: កំណត់ត្រាវិស្វកម្មសំណង់
          site_description: អត្ថបទពីការរចនាដែកសំណង់ ឌីណាមិចរចនាសម្ព័ន្ធ និងវិស្វកម្មរញ្ជួយដី
          nav_translations:
            Home: ទំព័រដើម
            Blog: អត្ថបទ
            Tools: ឧបករណ៍
            About: អំពី
            Book: សៀវភៅ
            Forced harmonic response: ចម្លើយអាម៉ូនិកដោយបង្ខំ
            Suddenly applied load: បន្ទុកដែលដាក់ភ្លាមៗ
            Free vibration: ចលនាសេរី
            IPE 330 buckling: ការកោងសសរ IPE 330
            Welcome: សូមស្វាគមន៍
  - blog:
      enabled: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:       # equations written with $...$ and $$...$$
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Book:
      - book/index.md
      - 1. Introduction: book/01-introduction.md
      - 2. Cross-section classification: book/02-classification.md
      - 3. Flexural buckling: book/03-buckling.md
  - Blog:
      - blog/index.md
      - Forced harmonic response: blog/posts/forced-harmonic-response.md
      - Suddenly applied load: blog/posts/response_to_p0.md
      - Free vibration: "blog/posts/damped free vibration of 1 dof system.md"
      - IPE 330 buckling: blog/posts/flexural-buckling-ipe330.md
      - Welcome: blog/posts/welcome.md
  - Tools: tools.md
  - About: about.md
